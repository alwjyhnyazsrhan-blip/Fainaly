<!doctype html>
<html lang="ar" dir="rtl" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=880, user-scalable=no" />
    <meta name="google" content="notranslate" />
    <title>Remix ملوك الاعماق</title>
    <meta name="description" content="لعبة ملوك الأعماق - مغامرات القراصنة والحروب البحرية الاستراتيجية مع نظام أمان متقدم ومنع تعدد الجلسات" />
    <meta property="og:title" content="Remix ملوك الاعماق" />
    <meta property="og:description" content="لعبة ملوك الأعماق - مغامرات القراصنة والحروب البحرية الاستراتيجية مع نظام أمان متقدم ومنع تعدد الجلسات" />
    
    <!-- Preload critical local game assets for instant rendering -->
    <link rel="preload" href="/backgrounds/harbor_main.webp" as="image" type="image/webp" />
    <link rel="preload" href="/ships/ship_00.webp" as="image" type="image/webp" />
    <link rel="preload" href="/icons/res/gold-coin.webp" as="image" type="image/webp" />
    <link rel="preload" href="/icons/res/gem.webp" as="image" type="image/webp" />

    <!-- Speed up external asset connections -->
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b1329" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ملوك الأعماق" />

    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: manipulation;
        background-color: #0b1329;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        background: radial-gradient(circle at center, #1e293b 0%, #0b1329 100%);
        gap: 16px;
      }
      .initial-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s infinite linear;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script>
      window.__appLoaded = false;

      // Global function to purge all service workers, storage, caches and force reload
      window.clearCacheAndReload = function() {
        console.log('[RELOAD] Clearing caches and service workers...');
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          sessionStorage.clear();
        } catch(err) {
          console.warn('Error clearing caches:', err);
        }
        setTimeout(function() {
          window.location.reload(true);
        }, 150);
      };

      // Catch unhandled errors for debugging in console
      window.addEventListener('error', function(e) {
        console.error('[CRITICAL APPLICATION ERROR]', e);
      });

      window.addEventListener('unhandledrejection', function(e) {
        console.error('[UNHANDLED PROMISE REJECTION]', e.reason);
      });

      // Prevent pinch-to-zoom on touchscreens
      document.addEventListener('touchmove', function (event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });

      // Prevent Safari gesture scaling
      document.addEventListener('gesturestart', function (event) { event.preventDefault(); });
      document.addEventListener('gesturechange', function (event) { event.preventDefault(); });
      document.addEventListener('gestureend', function (event) { event.preventDefault(); });

      // Register PWA Service Worker with auto-update
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('PWA Service Worker registered!', reg);
              // Check for SW updates
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New content is available; please refresh.');
                    }
                  };
                }
              };
            })
            .catch(err => console.error('PWA Service Worker registration failed!', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" id="initial-loader-wrapper">
        <div style="font-size: 40px; animation: bounce 1.5s infinite; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));">⚓</div>
        <div class="initial-spinner"></div>
        <div id="initial-loader-msg" style="font-size: 17px; color: #38bdf8; font-weight: bold; margin-top: 8px; text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);">جاري تحميل لعبة ملوك الأعماق...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
